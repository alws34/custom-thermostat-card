# Example Lovelace views for custom-thermostat-card.
# Copy the blocks you need into your own dashboard.

views:
  - title: Climate
    type: sections
    sections:
      - type: grid
        cards:
          # 1. Adaptive compact tile that opens the full control in an overlay
          - type: custom:custom-thermostat-card
            entity: climate.living_room

          # 2. Adaptive compact tile that expands inline
          - type: custom:custom-thermostat-card
            entity: climate.bedroom
            display: compact
            open_behavior: inline

          # 3. Full horseshoe from the start
          - type: custom:custom-thermostat-card
            entity: climate.office
            display: full
            name: Office AC

          # 4. Dual-setpoint (heat/cool) thermostat, reel animation
          - type: custom:custom-thermostat-card
            entity: climate.hallway
            display: full
            number_animation: reel

          # 5. Water heater
          - type: custom:custom-thermostat-card
            entity: water_heater.tank
            display: full

          # 6. card-mod: recolour the active arc and enlarge the readout
          - type: custom:custom-thermostat-card
            entity: climate.living_room
            display: full
            card_mod:
              style: |
                ha-card {
                  --atc-heat: #e0553b;
                  --atc-dial-size: 260px;
                }
                atc-full::part(dial-readout) {
                  font-weight: 600;
                }
