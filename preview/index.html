<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thermostat Card Preview</title>
    <style>
      :root {
        color-scheme: light dark;
        --page-bg: #f2f3f5;
        --page-fg: #1c1c1e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--page-bg);
        color: var(--page-fg);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        align-items: center;
        padding: 12px 18px;
        background: color-mix(in srgb, var(--page-bg) 88%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(127, 127, 127, 0.2);
      }
      header h1 { font-size: 15px; margin: 0 12px 0 0; }
      header label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
      select, button { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35); background: transparent; color: inherit; }
      main { padding: 22px; display: grid; gap: 26px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); align-items: start; }
      .cell { display: grid; gap: 8px; }
      .cell h2 { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .6; margin: 0; }
      .surface { padding: 20px; border-radius: 16px; }
      .resizer { resize: horizontal; overflow: auto; min-width: 190px; max-width: 100%; }
      .toast {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
        background: #333; color: #fff; padding: 8px 14px; border-radius: 999px;
        font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99;
      }
      .toast.show { opacity: 1; }

      /* ---- theme token sets applied to .surface ---- */
      .t-ha-light {
        --card-background-color: #ffffff;
        --ha-card-background: #ffffff;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --divider-color: rgba(0, 0, 0, 0.12);
        --primary-color: #03a9f4;
        --ha-card-border-radius: 12px;
        --ha-card-box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        --error-color: #db4437;
        background: #e9eaec;
      }
      .t-ha-dark {
        --card-background-color: #1c1c1c;
        --ha-card-background: #1c1c1c;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --divider-color: rgba(255, 255, 255, 0.12);
        --primary-color: #2391d6;
        --ha-card-border-radius: 12px;
        --ha-card-box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        --error-color: #ff5252;
        background: #111214;
      }
      .t-neu-light {
        --card-background-color: #e8edf0;
        --ha-card-background: #e8edf0;
        --primary-text-color: #26343c;
        --secondary-text-color: #6a7a84;
        --divider-color: rgba(38, 52, 60, 0.14);
        --primary-color: #18a7a0;
        --ha-card-border-radius: 22px;
        --ha-card-box-shadow: 9px 9px 19px #c4c9cc, -9px -9px 19px #ffffff;
        --error-color: #d0473f;
        background: #e8edf0;
      }
      .t-neu-dark {
        --card-background-color: #2c3339;
        --ha-card-background: #2c3339;
        --primary-text-color: #f6f7f8;
        --secondary-text-color: #aeb8bf;
        --divider-color: rgba(255, 255, 255, 0.1);
        --primary-color: #55d7d1;
        --ha-card-border-radius: 24px;
        --ha-card-box-shadow: 0 16px 32px rgba(0, 0, 0, 0.36);
        --error-color: #ff6b6b;
        background: #20272d;
      }
      /* semantic HVAC colours – same in all sets, theme can override */
      .surface {
        --state-climate-heat-color: #ff8c42;
        --state-climate-cool-color: #2b9af9;
        --state-climate-dry-color: #efbd07;
        --state-climate-fan_only-color: #8fd0e6;
        --state-climate-idle-color: var(--secondary-text-color);
        --state-climate-off-color: #9e9e9e;
        --disabled-text-color: #b0b0b0;
      }
      body.rtl { direction: rtl; }
      body.reduce * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    </style>
  </head>
  <body>
    <header>
      <h1>Adaptive Thermostat Card</h1>
      <label>Theme
        <select id="theme">
          <option value="t-ha-light">HA Light</option>
          <option value="t-ha-dark">HA Dark</option>
          <option value="t-neu-light">Neumorphism Light</option>
          <option value="t-neu-dark">Neumorphism Dark</option>
        </select>
      </label>
      <label><input type="checkbox" id="reduce" /> Reduced motion</label>
      <label><input type="checkbox" id="rtl" /> RTL</label>
      <button id="reset">Reset entities</button>
    </header>
    <main id="gallery"></main>
    <div class="toast" id="toast"></div>

    <script type="module" src="../dist/adaptive-thermostat-card.js"></script>
    <script type="module" src="./preview.mjs"></script>
  </body>
</html>
